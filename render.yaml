services:
  - type: web
    name: campus-lost-and-found-nlp
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT || python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: UNIVERSITY_EMAIL_DOMAINS
        value: kanchiuniv.ac.in,gmail.com
      - key: DEMO_SEED
        value: "1"
